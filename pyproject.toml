[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chutes-e2ee"
version = "0.1.0"
description = "End-to-end encrypted transport for Chutes AI, compatible with the OpenAI Python SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Chutes AI" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.25.0",
    "cryptography>=42.0",
    "pqcrypto>=0.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://chutes.ai"
Repository = "https://github.com/chutes-ai/chutes-e2ee"

[tool.hatch.build.targets.wheel]
packages = ["src/chutes_e2ee"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
